name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive: lab-agent-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            archive: lab-agent-linux-arm64.tar.gz
          - os: macos-15-intel
            platform: darwin-x64
            archive: lab-agent-darwin-x64.tar.gz
          - os: macos-15
            platform: darwin-arm64
            archive: lab-agent-darwin-arm64.tar.gz
          - os: windows-latest
            platform: windows-x64
            archive: lab-agent-windows-x64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Compile
        run: bun run compile
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp dist/lab dist/lab-engine LICENSE README.md NOTICE release/
          tar -czf "${{ matrix.archive }}" -C release .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/lab.exe,dist/lab-engine.exe,LICENSE,README.md,NOTICE release
          Compress-Archive -Path release/* -DestinationPath '${{ matrix.archive }}'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum lab-agent-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
